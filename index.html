<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="電車3D">
<meta name="theme-color" content="#060a16">
<title>電車 3D 導航（大阪・東京・台北）</title>
<style>
:root{--bg:#060a16;--card:#0f1930;--card2:#16223f;--line:#22335a;--tx:#eaf0fc;--mut:#93a3c4;--acc:#ffb547;--ok:#3ddc97;--bad:#ff5d6c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:#8cc4ff}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#stage{position:relative;height:44vh;height:44dvh;min-height:230px;flex:none;transition:height .3s ease;overflow:hidden}
body.big #stage{height:70vh;height:70dvh}
#c3d{width:100%;height:100%;display:block;touch-action:none}
#topbar{position:absolute;inset:0 0 auto 0;padding:calc(env(safe-area-inset-top) + 8px) 12px 18px;display:flex;align-items:center;gap:8px;background:linear-gradient(#060a16ee,#060a1600);pointer-events:none}
#topbar .title{font-weight:800;font-size:16px;letter-spacing:.5px;flex:1;text-align:left;pointer-events:auto;padding:0}
#topbar .title i{font-style:normal;font-size:12px;color:var(--acc)}
#topbar .title small{display:block;font-weight:500;font-size:11px;color:var(--mut);letter-spacing:0}
.citylist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.citylist button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.citylist button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.citylist b{font-size:17px}
.fab{pointer-events:auto;width:38px;height:38px;border-radius:12px;background:#0f1930cc;border:1px solid var(--line);font-size:17px;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#miniHud{position:absolute;left:10px;right:10px;bottom:10px;display:none;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:#0b1428e6;border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px}
#miniHud.show{display:flex}
#miniHud .mh-t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#miniHud b{color:var(--acc)}
#tabs{display:flex;background:#0a1224;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
#tabs button{flex:1;padding:11px 0 9px;font-size:13px;white-space:nowrap;color:var(--mut);position:relative}
#tabs button.on{color:var(--tx);font-weight:700}
#tabs button.on:after{content:"";position:absolute;left:28%;right:28%;bottom:0;height:3px;border-radius:3px;background:var(--acc)}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(env(safe-area-inset-bottom) + 28px)}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
small{color:var(--mut)}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
.primary{background:linear-gradient(135deg,#ffb547,#ff8a3d);color:#1b1206;font-weight:800;border-radius:12px;padding:13px 10px;font-size:15px;width:100%}
.sec{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-size:14px;width:100%}
.danger{color:#ff9aa4}
.od{display:grid;grid-template-columns:1fr 40px;grid-template-rows:auto auto;gap:8px;align-items:center}
.stbtn{grid-column:1;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.stbtn .lbl{font-size:11px;color:var(--mut)}
.stbtn .val{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stbtn .val b{font-size:17px}
.ph{color:var(--mut)}
#swap{grid-column:2;grid-row:1 / span 2;height:100%;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:18px}
.bl{display:inline-flex;gap:3px;flex-wrap:wrap;margin-left:auto}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:7px;border:3px solid var(--c);background:#fff;color:#111;font-weight:900;font-size:11px;line-height:1;flex:none}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--mut)}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--acc);color:#1b1206;border-color:var(--acc);font-weight:700}
.sum .big{font-size:30px;font-weight:900}
.sum .big small{font-size:15px}
.ext{display:block;text-align:center;margin-top:10px;font-size:13px}
.tl{position:relative;margin:4px 0 12px 8px;padding-left:20px;border-left:2px dashed #2a3c66}
.tl-i{position:relative;margin:0 0 12px}
.tl-i>i{position:absolute;left:-28px;top:4px;width:14px;height:14px;border-radius:50%;background:#2a3c66;border:3px solid var(--bg)}
.tl-i.start>i{background:var(--ok)}.tl-i.end>i{background:var(--bad)}
.tl-i.ride>i{background:var(--c);top:14px}
.tl-i.walk{font-size:14px;color:var(--mut)}
.ride-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:12px}
.rc-h{display:flex;gap:10px;align-items:center}
.rc-h .badge{min-width:30px;height:30px;font-size:13px;border-width:4px;border-color:var(--c)}
.rc-h b{display:block;font-size:16px}
.rc-h small{font-size:12px}
.rc-d{margin-top:8px;font-size:15px}
.rc-m{margin-top:4px;font-size:14px;line-height:1.5}
details{margin-top:6px;font-size:14px}
summary{color:#8cc4ff;cursor:pointer}
ol{margin:6px 0 0;padding-left:22px;line-height:1.7}
.tip{margin-top:8px;font-size:13px;color:#ffd99a;background:#2a210e66;border-radius:10px;padding:8px 10px;line-height:1.5}
.note{font-size:12px;color:var(--mut);line-height:1.55}
.exit{border-color:#3a4f7a}
.spot .sp-h b{font-size:16px}
.spot .mut{margin-top:4px;line-height:1.5}
.sp-st{margin-top:8px;font-size:14px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ridebox{border-top:4px solid var(--c)}
.ride-main{padding:12px 0 6px}
.ph-l{font-size:14px;color:var(--mut)}
.big2{font-size:30px;font-weight:900;margin:4px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.big2 .badge{min-width:30px;height:30px;font-size:13px}
.big2.alert{color:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.dir{font-size:16px;margin-bottom:4px}
.warn{background:#ff8a3d22;border:1px solid #ff8a3d;color:#ffc58f;border-radius:10px;padding:8px 10px;font-weight:700;margin-top:6px}
.prog{height:6px;background:#1c2a4a;border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--c);transition:width .5s}
.strip{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sx{flex:none;font-size:13px;padding:5px 9px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.sx.past{opacity:.45}
.sx.cur{background:var(--c);color:#fff;font-weight:700}
.sx.next{background:#fff;color:#111;font-weight:800}
.sa{color:#3a4c75;flex:none}
.eta{font-size:14px;margin:6px 0 2px}
.eta b{color:var(--acc);font-size:16px}
.ctl-r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.ctl-r>span{font-size:14px}
.ctl-r>.sec{flex:1}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 11px;font-size:13px}
.seg button.on{background:var(--acc);color:#1b1206;font-weight:800}
.sw{min-width:56px;padding:7px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.sw.on{background:var(--ok);color:#06210f;font-weight:800;border-color:var(--ok)}
h3{margin:4px 0 8px;font-size:16px}
.info li{margin-bottom:8px;line-height:1.55;font-size:14px}
#frameNote{display:none}
/* picker */
#picker{position:fixed;inset:0;z-index:50;background:#060a16;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top)}
#picker.open{transform:none}
.pk-top{display:flex;gap:8px;align-items:center;padding:12px}
.pk-top b{flex:1;font-size:16px}
#pkSearch{width:calc(100% - 24px);margin:0 12px 8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:16px;outline:none}
#pkList{flex:1;overflow-y:auto;padding:0 12px calc(env(safe-area-inset-bottom) + 20px)}
.pk-g{font-size:12px;color:var(--acc);margin:14px 4px 6px;font-weight:700}
.pk-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
.pk-i>span:first-child{display:flex;flex-direction:column}
.pk-i b{font-size:16px}
.empty{padding:30px;text-align:center;color:var(--mut)}
/* pop sheet */
#pop{position:fixed;inset:0;z-index:45;background:#0008;display:none;align-items:flex-end}
#pop.open{display:flex}
.pop-sheet{position:relative;width:100%;max-height:82vh;overflow-y:auto;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.pop-x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--card2);font-size:14px}
.pop-h{display:flex;flex-direction:column;gap:2px;padding-right:40px}
.pop-h b{font-size:18px}
.okline{margin-top:8px;color:var(--ok);font-size:14px}
.sel{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:10px 8px;font-size:14px;width:100%;-webkit-appearance:none;appearance:none}
.sel.sm{width:auto;padding:6px 8px;font-size:13px;border-radius:9px}
.star{float:right;font-size:22px;line-height:1;color:var(--mut);padding:0 2px}
.star.on{color:#ffd34d}
.sp-h{overflow:hidden}
.cbox{width:100%;min-height:150px;margin-top:10px;background:#0a1224;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;line-height:1.5;font-family:inherit}
/* trip */
.trip-top{display:flex;gap:8px}
.mini{width:auto;white-space:nowrap;padding:9px 12px}
.fld{margin-top:10px;flex:1;min-width:0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.fld input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:10px 12px;font-size:16px;font-family:inherit;min-height:44px}
.fld2{display:flex;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:44px}
.stepper button{width:44px;height:42px;font-size:20px}
.stepper b{font-size:17px}
.sec.left{text-align:left;padding:11px 12px}
.cloudline{margin-top:10px;font-size:13px;color:#9fd2ff}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hrow b{font-size:16px}
.wish{display:flex;flex-direction:column;gap:6px}
.wi{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;font-size:14px}
.wi span{flex:1}
.x{width:30px;height:30px;border-radius:8px;color:var(--mut)}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytabs .chip{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.25;position:relative;padding:7px 14px}
.daytabs .chip small{font-size:11px;color:inherit;opacity:.8}
.daytabs .chip i{position:absolute;top:-4px;right:-4px;font-style:normal;background:var(--ok);color:#06210f;font-size:10px;font-weight:800;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center}
.tm{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.tm input{background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:5px 6px;font-size:15px;font-family:inherit}
.tl2{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.stop{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px}
.stop .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#1b1206;font-weight:900;display:grid;place-items:center;font-size:14px}
.stop .num.start{background:var(--ok)}.stop .num.end{background:var(--bad);color:#fff}
.stop.se{background:transparent}
.sb{flex:1;min-width:0}
.sb b{font-size:15px}
.sctl{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.sctl button,.sctl select{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--tx);height:32px;min-width:32px;padding:0 7px;font-size:13px;font-family:inherit;-webkit-appearance:none;appearance:none}
.leg{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-left:14px;width:calc(100% - 14px);padding:8px 10px;border-left:3px dashed #3a4c75;font-size:13px;color:#cfe0ff}
.leg .lt{flex:1;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.leg .chev{color:var(--mut)}
.leg.same,.leg.none{color:var(--mut)}
.card>.leg{margin:6px 0 0;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.legd{margin:0 0 4px 14px;padding:10px;border-radius:12px;background:#0a1224;border:1px solid var(--line)}
.sc{font-size:14px;line-height:1.5;margin-bottom:6px}
.sumline{margin-top:10px;font-size:14px;line-height:1.6}
.sumline b{color:var(--acc)}
.warnc{color:#ffb08a}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,30px);opacity:0;transition:.25s;background:#1d2b4f;border:1px solid #3a4f7a;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:88vw;line-height:1.5;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c3d"></canvas>
    <div id="topbar">
      <button class="title" id="cityBtn"><span id="cityTitle">🚃 電車 3D 導航</span> <i>▾</i><small id="citySub"></small></button>
      <button class="fab" id="btnFit" title="重設視角">🎯</button>
      <button class="fab" id="btnBig" title="放大 3D">⤢</button>
    </div>
    <div id="miniHud"></div>
  </div>
  <nav id="tabs">
    <button data-t="plan" class="on">🧭 路線</button>
    <button data-t="spots">📍 景點</button>
    <button data-t="trip">🗓️ 行程</button>
    <button data-t="ride">🚃 乘車</button>
    <button data-t="info">⚙️ 設定</button>
  </nav>
  <main id="panel">
    <section class="tab on" id="tab-plan">
      <div class="card">
        <div class="od">
          <button class="stbtn" id="btnFrom"><span class="lbl">出發</span><span class="val" id="fromVal"></span></button>
          <button id="swap" aria-label="對調">⇅</button>
          <button class="stbtn" id="btnTo"><span class="lbl">目的地</span><span class="val" id="toVal"></span></button>
        </div>
        <div class="row"><button class="sec" id="btnHome">🏨 設定住宿車站</button><button class="sec" id="btnNear" style="flex:.6">📍 附近車站</button></div>
        <div class="chips" id="nearList"></div>
        <label class="chk"><input type="checkbox" id="fewer"> 少轉乘優先（多花一點時間也沒關係）</label>
        <div class="row"><button class="primary" id="btnPlan">規劃路線</button></div>
      </div>
      <div id="result"></div>
    </section>
    <section class="tab" id="tab-spots">
      <div class="chips" id="spotChips" style="margin:0 0 12px"></div>
      <div id="spotList"></div>
    </section>
    <section class="tab" id="tab-trip"><div id="tripBox"></div></section>
    <section class="tab" id="tab-ride"><div id="rideBox"></div></section>
    <section class="tab" id="tab-info">
      <div class="card">
        <h3>🏨 住宿車站</h3>
        <div style="display:flex;align-items:center;gap:8px"><div id="homeVal" style="flex:1"></div><button class="sec" id="btnSetHome" style="width:auto;padding:9px 14px">變更</button></div>
      </div>
      <div class="card">
        <h3>📡 定位</h3>
        <div class="note" id="frameNote">⚠️ 目前是內嵌在 Claude 中開啟，定位會被封鎖。乘車導航仍可用時間推算＋手動「到站」校正。想用 GPS，請把這份 HTML 放到 GitHub Pages 等 HTTPS 網址，用手機 Safari／Chrome 開啟（可「加入主畫面」當 App 用）。</div>
        <div class="row"><button class="sec" id="btnGpsTest">測試定位／找附近車站</button></div>
      </div>
      <div class="card info">
        <h3 id="tipsTitle">🧳 搭車小提醒</h3>
        <ul style="padding-left:18px;margin:0" id="cityTips"></ul>
      </div>
      <p class="note">行車時間為一般班次的估算（含平均候車），並非即時時刻表；車站與路網為主要觀光路線的簡化版，座標為概略位置。實際出發前可用 Google 地圖確認即時班次。</p>
    </section>
  </main>
</div>
<div id="picker">
  <div class="pk-top"><b id="pkTitle">選擇車站</b><button class="sec" id="pkClose" style="width:auto;padding:8px 14px">關閉</button></div>
  <input id="pkSearch" type="search" placeholder="搜尋：難波 / なんば / Namba / USJ" autocomplete="off">
  <div id="pkList"></div>
</div>
<div id="pop"><div class="pop-sheet"><button class="pop-x" id="popClose" aria-label="關閉">✕</button><div id="popBody"></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const CITIES = {};

CITIES.osaka = (function(){
// ====== 車站資料 [日文名, 英文, 緯度, 經度, 中文別名(搜尋用)] ======
const ST = {
  shinosaka:['新大阪','Shin-Osaka',34.7334,135.5002,'新大阪 新幹線'],
  nishinakajima:['西中島南方','Nishinakajima-Minamigata',34.7262,135.4993],
  nakatsu:['中津','Nakatsu',34.7094,135.4972],
  umeda:['梅田','Umeda',34.7027,135.4982,'梅田 大阪站'],
  osaka:['大阪','Osaka (JR)',34.7025,135.4959,'大阪站 JR 梅田'],
  higashiumeda:['東梅田','Higashi-Umeda',34.7008,135.5003,'梅田'],
  nishiumeda:['西梅田','Nishi-Umeda',34.6996,135.4955,'梅田'],
  hankyuumeda:['大阪梅田（阪急）','Osaka-umeda (Hankyu)',34.7055,135.4988,'阪急 梅田'],

const LMAP = {};
const SERVE = {};   // 站 -> [lineId]
const WADJ = {};    // 站 -> [[站, 分]]
(function buildNet(){
  for (const L of LINES){
    LMAP[L.id] = L;
    L.real = []; L.wp = []; L.mins = [];
    let pend = [];
    for (const it of L.stops){
      if (it[0] === '@'){ pend.push([it[1], it[2]]); continue; }
      if (L.real.length){ L.wp.push(pend); L.mins.push(it[1]); }
      pend = [];
      L.real.push(it[0]);
      (SERVE[it[0]] = SERVE[it[0]] || []).push(L.id);
    }
    if (L.loop){ L.wp.push([]); L.mins.push(L.loopMin || L.stops[1][1] || 2); }
    L.idx = {}; L.real.forEach((id,i) => L.idx[id] = i);
  }
  for (const [a,b,m] of WALK){
    (WADJ[a] = WADJ[a] || []).push([b,m]);
    (WADJ[b] = WADJ[b] || []).push([a,m]);
  }
})();

function stName(id){ return ST[id] ? ST[id][0] : id; }

function lineNeighbors(L, st){
  const i = L.idx[st], n = L.real.length, out = [];
  if (i == null) return out;
  if (i < 0) return out;
  if (i + 1 < n) out.push([L.real[i+1], L.mins[i]]);
  else if (L.loop) out.push([L.real[0], L.mins[n-1]]);
  if (i - 1 >= 0) out.push([L.real[i-1], L.mins[i-1]]);
  else if (L.loop) out.push([L.real[n-1], L.mins[n-1]]);
  return out;
}

function planRoute(from, to, fewer){
  if (from === to) return null;
  const XP = fewer ? 12 : 2;
  const dist = new Map(), prev = new Map(), done = new Set();
  const pq = [];   // 二元堆積
  const hpush = it => { pq.push(it); let i = pq.length-1; while (i > 0){ const j = (i-1) >> 1; if (pq[j][0] <= pq[i][0]) break; [pq[i], pq[j]] = [pq[j], pq[i]]; i = j; } };
  const hpop = () => { const top = pq[0], last = pq.pop(); if (pq.length){ pq[0] = last; let i = 0; for(;;){ const l = 2*i+1, r = l+1; let m = i; if (l < pq.length && pq[l][0] < pq[m][0]) m = l; if (r < pq.length && pq[r][0] < pq[m][0]) m = r; if (m === i) break; [pq[i], pq[m]] = [pq[m], pq[i]]; i = m; } } return top; };
  const push = (key, d, p) => {
    if (dist.has(key) && dist.get(key) <= d) return;
    dist.set(key, d); prev.set(key, p); hpush([d, key]);
  };
  for (const lid of (SERVE[from]||[])) push(from+'|'+lid, LMAP[lid].wait, {k:'START', t:'board'});
  for (const [b,w] of (WADJ[from]||[]))
    for (const lid of (SERVE[b]||[])) push(b+'|'+lid, w + LMAP[lid].wait, {k:'START', t:'walk', min:w, a:from, b});
  while (pq.length){
    const [d, key] = hpop();
    if (done.has(key)) continue; done.add(key);
    if (key === 'END') break;
    const bar = key.indexOf('|'), st = key.slice(0, bar), lid = key.slice(bar+1);
    if (st === to) push('END', d, {k:key, t:'arrive'});
    for (const [b,w] of (WADJ[st]||[])) if (b === to) push('END', d + w, {k:key, t:'walkend', min:w, a:st, b});
    const L = LMAP[lid];
    for (const [nb, m] of lineNeighbors(L, st)) push(nb+'|'+lid, d + m, {k:key, t:'ride', min:m});
    for (const l2 of SERVE[st]) if (l2 !== lid) push(st+'|'+l2, d + 3 + LMAP[l2].wait + XP, {k:key, t:'xfer', min:3});
    for (const [b,w] of (WADJ[st]||[]))
      for (const l2 of (SERVE[b]||[])) if (l2 !== lid) push(b+'|'+l2, d + w + LMAP[l2].wait + XP, {k:key, t:'walk', min:w, a:st, b});
  }
  if (!dist.has('END')) return null;
  // 回溯
  const chain = [];
  let k = 'END';
  while (k !== 'START'){ const p = prev.get(k); chain.push({key:k, p}); k = p.k; }
  chain.reverse();
  const steps = [];
  let cur = null;
  for (const {key, p} of chain){
    if (p.t === 'walk' || p.t === 'walkend'){ cur = null; steps.push({type:'walk', a:p.a, b:p.b, min:p.min}); }
    if (p.t === 'xfer'){ cur = null; steps.push({type:'xfer', at:key.split('|')[0], min:p.min}); }
    if (key === 'END') break;
    const [st, lid] = key.split('|');
    if (p.t === 'ride'){
      cur.stations.push(st); cur.mins.push(p.min);
    } else {
      cur = {type:'ride', line:lid, stations:[st], mins:[]};
      steps.push(cur);
    }
  }
  // 去除空的乘車段（理論上不會發生），並決定方向
  const out = steps.filter(s => s.type !== 'ride' || s.stations.length > 1);
  let rides = 0, stops = 0;
  for (const s of out){
    if (s.type !== 'ride') continue;
    const L = LMAP[s.line];
    const i0 = L.real.indexOf(s.stations[0]), i1 = L.real.indexOf(s.stations[1]), n = L.real.length;
    s.fwd = L.loop ? ((i0 + 1) % n === i1) : (i1 > i0);
    s.total = s.mins.reduce((x,y)=>x+y, 0);
    if (L.loop){
      const nx = s.stations[1];
      const j = L.real.indexOf(nx), nx2 = L.real[(j + (s.fwd ? 1 : -1) + n) % n];
      s.dirLabel = stName(nx) + '・' + stName(nx2) + '方面';
    } else s.dirLabel = L.dir[s.fwd ? 0 : 1];
    rides++; stops += s.stations.length - 1;
  }
  // 合併連續的 xfer/walk 雜訊：若 walk 後立刻 xfer（不應發生）忽略
  return {from, to, steps: out, total: Math.round(dist.get('END')), transfers: Math.max(0, rides-1), stops};
}

// 取一段乘車的畫線座標（含轉折點），回傳 [{lat,lon,st|null}]
function ridePolyline(s){
  const L = LMAP[s.line], n = L.real.length, pts = [];
  for (let i=0;i<s.stations.length;i++){
    const id = s.stations[i];
    pts.push({lat:ST[id][2], lon:ST[id][3], st:id});
    if (i+1 < s.stations.length){
      const a = L.real.indexOf(id), b = L.real.indexOf(s.stations[i+1]);
      let w;
      if (s.fwd) w = L.wp[a] || [];
      else w = (L.wp[b] || []).slice().reverse();
      for (const [la,lo] of w) pts.push({lat:la, lon:lo, st:null});
    }
  }
  return pts;
}

function haversine(a1,o1,a2,o2){
  const R=6371, r=Math.PI/180;
  const da=(a2-a1)*r, dn=(o2-o1)*r;
  const h=Math.sin(da/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function nearestStations(lat, lon, k=3){
  return Object.keys(ST).map(id => [id, haversine(lat,lon,ST[id][2],ST[id][3])])
    .sort((x,y)=>x[1]-y[1]).slice(0,k);
}

  // 大阪灣（概略）
  const sh = new THREE.Shape();
  BAY.forEach(([la,lo],i) => { const x=(lo-LON0)*KX, y=(la-LAT0)*KZ; i ? sh.lineTo(x,y) : sh.moveTo(x,y); });
  const bay = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshBasicMaterial({color:0x0a2147}));
  bay.rotation.x = -Math.PI/2; bay.position.y = 0.004; scene.add(bay);
  for (const [la,lo,w,h,r] of (CITY.ISLES || [])){
    const isle = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({color:0x0f182e}));
    isle.rotation.x = -Math.PI/2; isle.rotation.z = r; isle.position.copy(P(la, lo, 0.008)); scene.add(isle);
  }
  const grid = new THREE.GridHelper(500, 500, 0x1a2950, 0x111b38);
  grid.position.y = 0.01; grid.material.transparent = true; grid.material.opacity = 0.5; scene.add(grid);

  buildCity(); buildNetwork(); buildSpotMarkers();
  routeGroup = new THREE.Group(); scene.add(routeGroup);
  train = makeTrain(); train.visible = false; scene.add(train);
  userDot = new THREE.Group();
  const ud = new THREE.Mesh(new THREE.SphereGeometry(0.05,16,12), new THREE.MeshBasicMaterial({color:0x4aa8ff}));
  ud.position.y = 0.12;
  const ur = new THREE.Mesh(new THREE.RingGeometry(0.9,1,40), new THREE.MeshBasicMaterial({color:0x4aa8ff, transparent:true, opacity:0.35, side:THREE.DoubleSide}));
  ur.rotation.x = -Math.PI/2; ur.position.y = 0.03; userDot.add(ud, ur); userDot.ring = ur; userDot.visible = false; scene.add(userDot);

  new ResizeObserver(resize).observe($('#stage'));
  resize(); setupControls(cv);
  clock = new THREE.Clock();
  requestAnimationFrame(loop);
}

function resize(){
  const st = $('#stage'); const w = st.clientWidth, h = st.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}

function buildCity(){
  const rnd = mulberry(20261121);
  const items = [];
  for (const id in ST){
    const hub = HUBS.includes(id) || (SERVE[id]||[]).length >= 4;
    const n = hub ? 26 : 7, R = hub ? 1.1 : 0.55;
    const c = P(ST[id][2], ST[id][3]);
    for (let i=0;i<n;i++){
      const a = rnd()*Math.PI*2, r = 0.12 + Math.sqrt(rnd())*R;
      const x = c.x + Math.cos(a)*r, z = c.z + Math.sin(a)*r;
      const lat = LAT0 - z/KZ, lon = LON0 + x/KX;
      if (pointInPoly(lat, lon, BAY)) continue;
      const hgt = hub ? (0.03 + Math.pow(rnd(),2.2)*0.38) : (0.015 + rnd()*0.09);
      items.push([x, z, 0.04+rnd()*0.1, hgt, 0.04+rnd()*0.1, rnd()]);
    }
  }
  const geo = new THREE.BoxGeometry(1,1,1); geo.translate(0,0.5,0);
  const mat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.85, emissive:0x070c1c});
  const im = new THREE.InstancedMesh(geo, mat, items.length);
  const m = new THREE.Matrix4(), col = new THREE.Color();
  items.forEach(([x,z,w,h,d,r],i) => {
    m.makeScale(w,h,d); m.setPosition(x,0,z); im.setMatrixAt(i,m);
    col.setHSL(0.62, 0.35, r > 0.93 ? 0.42 : 0.14 + r*0.1); im.setColorAt(i, col);
  });
  scene.add(im);
}

function lineVecs(L, y){
  const pts = [];
  for (const it of L.stops){
    if (it[0] === '@') pts.push(P(it[1], it[2], y));
    else pts.push(P(ST[it[0]][2], ST[it[0]][3], y));
  }
  return pts;
}

function buildNetwork(){
  for (const L of LINES){
    const pts = lineVecs(L, 0.04);
    const curve = new THREE.CatmullRomCurve3(pts, !!L.loop, 'centripetal');
    const mat = new THREE.MeshBasicMaterial({color:L.color, transparent:true, opacity:0.55});
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length*14, 0.032, 5, !!L.loop), mat);
    mesh.userData.lid = L.id; lineMeshes.push(mesh); scene.add(mesh);
  }
  const ids = Object.keys(ST);
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.055,0.055,0.05,14), new THREE.MeshBasicMaterial({color:0xdfe7ff}), ids.length);
  const m = new THREE.Matrix4();
  ids.forEach((id,i) => { const v = P(ST[id][2], ST[id][3], 0.05); m.makeTranslation(v.x, v.y, v.z); im.setMatrixAt(i, m); });
  scene.add(im);
  for (const id of ids){
    const hub = HUBS.includes(id);
    const sp = makeLabel(ST[id][0], hub ? '#7d93c6' : '#4a5e8c');
    sp.position.copy(P(ST[id][2], ST[id][3], 0.2)); sp.userData.base = 0.08; sp.userData.net = true; sp.userData.st = id;
    sp.userData.px = hub ? 15 : 13; sp.userData.pri = hub ? 2 : 1;
    scene.add(sp); labels.push(sp);
  }
}

function makeTrain(){

  g.stripeMat = new THREE.MeshStandardMaterial({color:0xE5171F, emissive:0xE5171F, emissiveIntensity:0.45});
  const bodyGeo = new THREE.BoxGeometry(0.1, 0.075, 0.3);
  const bodyMat = new THREE.MeshStandardMaterial({color:0xf3f6fb, roughness:0.35, metalness:0.25, emissive:0x1d2433});
  const winMat = new THREE.MeshBasicMaterial({color:0xaee3ff});
  for (let i=0;i<3;i++){
    const car = new THREE.Group();
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.104, 0.03, 0.302), g.stripeMat); stripe.position.y = -0.02;
    const roof = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.012, 0.27), new THREE.MeshStandardMaterial({color:0x8a93a6})); roof.position.y = 0.043; car.add(roof);
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.103, 0.02, 0.25), winMat); win.position.y = 0.014;
    car.add(body, stripe, win);
    if (i === 0){
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.02,0.01), new THREE.MeshBasicMaterial({color:0xfff3c4}));
      hl.position.set(0,-0.01,0.152); car.add(hl);

}

function disposeGroup(gr){
  while (gr.children.length){
    const o = gr.children.pop();
    o.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.material){ if (x.material.map) x.material.map.dispose(); x.material.dispose(); } });
  }
}

function makePin(color){
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.08,0.24,16), new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.5}));
  cone.rotation.x = Math.PI; cone.position.y = 0.12;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.1,16,12), new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.6}));
  ball.position.y = 0.3;
  g.add(cone, ball); return g;
}

// route：單一路線；opt.legs：一天多段路線；opt.marks：[{y,x,label}] 編號景點
function buildRoute3D(route, opt={}){
  disposeGroup(routeGroup);
  for (let i=labels.length-1;i>=0;i--) if (!labels[i].userData.net) labels.splice(i,1);
  flows.length = 0; pins.length = 0; segs3D = []; hlLine = null;
  const routes = opt.legs ? opt.legs.filter(Boolean) : (route ? [route] : []);
  const active = routes.length > 0 || !!opt.marks;
  lineMeshes.forEach(m => { m.material.opacity = active ? 0.16 : 0.55; m.scale.set(1,1,1); });
  const onRoute = new Set(routes.flatMap(r => r.steps.flatMap(s => s.type === 'ride' ? s.stations : [])));
  labels.forEach(l => { l.material.opacity = active ? 0.6 : 1; l.userData.hide = onRoute.has(l.userData.st); l.userData.boost = false; });
  if (!active) return;
  const all = [];
  const flowGeo = new THREE.SphereGeometry(0.035, 8, 6);
  const labeled = new Set();
  for (const r of routes) for (const s of r.steps){
    if (s.type === 'walk'){
      const a = P(ST[s.a][2], ST[s.a][3], 0.1), b = P(ST[s.b][2], ST[s.b][3], 0.1);
      const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]), new THREE.LineDashedMaterial({color:0xffffff, dashSize:0.05, gapSize:0.04}));
      ln.computeLineDistances(); routeGroup.add(ln); continue;
    }
    if (s.type !== 'ride') continue;
    const L = LMAP[s.line];
    const pts = ridePolyline(s).map(p => P(p.lat, p.lon, 0.09));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    const len = curve.getLength();
    const N = Math.max(60, Math.ceil(len*60));
    const samples = curve.getSpacedPoints(N);
    const stPos = s.stations.map(id => P(ST[id][2], ST[id][3], 0.09));
    const stU = []; let from = 0;
    stPos.forEach((sp, k) => {
      let bi = from, bd = 1e9;
      for (let i=from;i<=N;i++){ const d = samples[i].distanceToSquared(sp); if (d < bd){ bd = d; bi = i; } }
      if (k === 0) bi = 0; if (k === stPos.length-1) bi = N;
      stU.push(bi/N); from = bi;
    });
    const seg = {step:s, line:L, curve, len, samples, stU, stPos, N};
    segs3D.push(seg); all.push(...pts);
    routeGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, N, 0.07, 8), new THREE.MeshBasicMaterial({color:L.color})));
    routeGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.ceil(N/2), 0.17, 8),
      new THREE.MeshBasicMaterial({color:L.color, transparent:true, opacity:0.2, depthWrite:false, blending:THREE.AdditiveBlending})));
    const fm = new THREE.MeshBasicMaterial({color:new THREE.Color(L.color).lerp(new THREE.Color(0xffffff), 0.6)});
    const nf = clamp(Math.round(len*2), 3, 40);
    for (let i=0;i<nf;i++){ const f = new THREE.Mesh(flowGeo, fm); routeGroup.add(f); flows.push({m:f, seg, u0:i/nf}); }
    stPos.forEach((sp, k) => {
      const end = (k === 0 || k === stPos.length-1);
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(end?0.12:0.085, end?0.12:0.085, 0.07, 18), new THREE.MeshStandardMaterial({color:0xffffff, emissive:end?L.color:0x333a4a, emissiveIntensity:end?0.6:0.4}));
      cyl.position.copy(sp); routeGroup.add(cyl);
      const sid = s.stations[k];
      if (labeled.has(sid)) return; labeled.add(sid);
      const lb = makeLabel(ST[sid][0], L.color, end);
      lb.position.copy(sp); lb.userData.base = 0.15; routeGroup.add(lb); labels.push(lb);
    });
  }
  if (routes.length === 1 && !opt.legs){
    const r = routes[0];
    const a = P(ST[r.from][2], ST[r.from][3], 0.05), b = P(ST[r.to][2], ST[r.to][3], 0.05);
    const p1 = makePin(0x3ddc97); p1.position.copy(a); const p2 = makePin(0xff5d6c); p2.position.copy(b);
    routeGroup.add(p1, p2); pins.push(p1, p2); all.push(a, b);
  }
  if (opt.home){ const h = P(ST[opt.home][2], ST[opt.home][3], 0.05); const p = makePin(0x3ddc97); p.position.copy(h); routeGroup.add(p); pins.push(p); all.push(h); }
  for (const m of (opt.marks || [])){
    const v = P(m.y, m.x, 0.05);
    const pin = makePin(0xffb547); pin.position.copy(v); routeGroup.add(pin); pins.push(pin);
    const lb = makeLabel(m.label, '#ffb547', true); lb.position.copy(v); lb.userData.base = 0.42; lb.userData.pri = 6; lb.userData.px = 17;
    routeGroup.add(lb); labels.push(lb); all.push(v);
  }
  if (all.length) fitPoints(all);
}

const spotMarks = [];   // {i, pos, mesh, label}
let hlLine = null;
function buildSpotMarkers(){
  const geo = new THREE.OctahedronGeometry(0.06, 0);
  const pole = new THREE.CylinderGeometry(0.008, 0.008, 0.26, 6); pole.translate(0, 0.13, 0);
  const poleMat = new THREE.MeshBasicMaterial({color:0xffb547, transparent:true, opacity:0.6});
  SPOTS.forEach((sp, i) => {
    const pos = P(sp.y, sp.x, 0.32);
    const mat = new THREE.MeshStandardMaterial({color:0xffb547, emissive:0xff8a3d, emissiveIntensity:0.6});
    const m = new THREE.Mesh(geo, mat); m.position.copy(pos); scene.add(m);
    const p = new THREE.Mesh(pole, poleMat); p.position.set(pos.x, 0, pos.z); scene.add(p);
    const lb = makeLabel(sp.n, '#c98a2c'); lb.position.copy(pos); lb.userData.base = 0.36;
    lb.userData.net = true; lb.userData.spot = i; lb.userData.px = 13; lb.userData.pri = 1.5;
    scene.add(lb); labels.push(lb);
    spotMarks.push({i, pos, mesh:m, label:lb});
  });
}
function refreshSpotMarkers(){
  const t = (typeof curTrip === 'function') ? curTrip() : null;
  const wish = new Set(t ? t.wish : []);
  const planned = new Set(t ? t.days.flatMap(d => d.stops.filter(s => s.s).map(s => s.s)) : []);
  for (const sm of spotMarks){
    const n = SPOTS[sm.i].n, w = wish.has(n), p = planned.has(n);
    sm.mesh.material.color.set(p ? 0x3ddc97 : w ? 0xffd34d : 0xffb547);
    sm.mesh.material.emissive.set(p ? 0x1d9a64 : w ? 0xffb000 : 0xff8a3d);
    sm.mesh.scale.setScalar(p || w ? 1.5 : 1);
    sm.label.userData.pri = p || w ? 2.5 : 1.5;
  }
}
function highlightLine(lid){
  buildRoute3D(null);
  hlLine = lid;
  const L = LMAP[lid];
  lineMeshes.forEach(m => { const on = m.userData.lid === lid; m.material.opacity = on ? 1 : 0.1; m.scale.set(1,1,1); });
  const st = new Set(L.real);
  labels.forEach(l => { l.userData.boost = st.has(l.userData.st); l.material.opacity = l.userData.boost ? 1 : 0.5; });
  const thick = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lineVecs(L, 0.06), !!L.loop, 'centripetal'), L.stops.length*14, 0.08, 8, !!L.loop),
    new THREE.MeshBasicMaterial({color:L.color}));
  routeGroup.add(thick);
  fitPoints(L.real.map(id => P(ST[id][2], ST[id][3])));
  toast(`${L.name}：${L.real.map(id => ST[id][0]).join('・')}`, 5000);
}
function handleTap(cx, cy){
  const rc = renderer.domElement.getBoundingClientRect();
  const x = cx - rc.left, y = cy - rc.top, W = rc.width, H = rc.height;
  const scr = v => { _v.copy(v).project(camera); return _v.z < 1 ? [(_v.x+1)/2*W, (1-_v.y)/2*H] : null; };
  let best = null;
  for (const sm of spotMarks){ const s = scr(sm.pos); if (!s) continue; const d = Math.hypot(s[0]-x, s[1]-y); if (d < 30 && (!best || d < best.d)) best = {d, spot:sm.i}; }
  if (!best){
    for (const id in ST){ const s = scr(P(ST[id][2], ST[id][3], 0.05)); if (!s) continue; const d = Math.hypot(s[0]-x, s[1]-y); if (d < 24 && (!best || d < best.d)) best = {d, st:id}; }
    for (const l of labels){ if (!l.visible || !l.userData.st) continue; const s = scr(l.position); if (!s) continue; const w = l.userData.px*l.userData.asp/2 + 4, h = l.userData.px/2 + 4;
      if (Math.abs(s[0]-x) < w && Math.abs(s[1]-y) < h){ const d = Math.hypot(s[0]-x, s[1]-y)*0.5; if (!best || d < best.d) best = {d, st:l.userData.st}; } }
    for (const l of labels){ if (!l.visible || l.userData.spot == null) continue; const s = scr(l.position); if (!s) continue; const w = l.userData.px*l.userData.asp/2 + 4, h = l.userData.px/2 + 4;
      if (Math.abs(s[0]-x) < w && Math.abs(s[1]-y) < h){ best = {d:0, spot:l.userData.spot}; break; } }
  }
  if (!best) return;
  if (best.spot != null) showSpotPop(best.spot); else showStationPop(best.st);
}

function fitPoints(pts){
  const box = new THREE.Box3().setFromPoints(pts);
  const c = box.getCenter(new THREE.Vector3()); const sz = box.getSize(new THREE.Vector3());
  c.y = 0;
  camS.tT = c; camS.tD = clamp(Math.max(sz.x, sz.z)*1.15 + 1.5, 2.5, 140);
  camS.follow = false; camS.el = 0.95; camS.tAz = 0.12; camS.auto = false;
}

function setupControls(cv){
  const pts = new Map(); let lastPinch = null, lastMid = null, tap = null;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    tap = pts.size === 1 ? {x:e.clientX, y:e.clientY, t:performance.now(), moved:0} : null; camS.auto = false; camS.tT = null; camS.tD = null; camS.tAz = null; lastPinch = null; });
  cv.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (tap) tap.moved += Math.abs(dx) + Math.abs(dy);
    camS.touchT = performance.now();
    if (pts.size === 1){
      if (camS.follow) camS.azOff -= dx*0.006; else camS.az -= dx*0.006;
      camS.el = clamp(camS.el + dy*0.005, 0.12, 1.45);
    } else if (pts.size === 2){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y), mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      if (lastPinch){
        camS.dist = clamp(camS.dist * lastPinch / d, 0.4, 160);
        if (!camS.follow){
          const k = camS.dist*0.0016, s = Math.sin(camS.az), c = Math.cos(camS.az);
          const mx = mid.x - lastMid.x, my = mid.y - lastMid.y;
          camS.target.x += -c*mx*k - s*my*k;
          camS.target.z +=  s*mx*k - c*my*k;
        }
      }
      lastPinch = d; lastMid = mid;
    }
  });
  const up = e => {
    if (e.type === 'pointerup' && tap && pts.size === 1 && tap.moved < 10 && performance.now() - tap.t < 450) handleTap(e.clientX, e.clientY);
    tap = null; pts.delete(e.pointerId); lastPinch = null; lastMid = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); camS.auto = false; camS.tD = null; camS.dist = clamp(camS.dist*Math.exp(e.deltaY*0.0012), 0.4, 160); }, {passive:false});
}

const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI*2)) - Math.PI; if (d < -Math.PI) d += Math.PI*2; return a + d*t; };

function updateCamera(dt){
  const k = 1 - Math.pow(0.02, dt);
  if (camS.follow && train.visible){
    const lead = train.cars[0];
    camS.target.lerp(lead.position.clone().setY(0.1), k*1.5 > 1 ? 1 : k*1.5);
    const dir = new THREE.Vector3(0,0,1).applyQuaternion(lead.quaternion);
    const want = Math.atan2(-dir.x, -dir.z) + camS.azOff;
    camS.az = angLerp(camS.az, want, k*0.8);
    if (performance.now() - camS.touchT > 5000) camS.azOff *= (1 - k*0.3);
  } else {
    if (camS.tT){ camS.target.lerp(camS.tT, k); if (camS.target.distanceTo(camS.tT) < 0.02) camS.tT = null; }
    if (camS.tD){ camS.dist += (camS.tD - camS.dist)*k; if (Math.abs(camS.dist - camS.tD) < 0.02) camS.tD = null; }
    if (camS.tAz != null){ camS.az = angLerp(camS.az, camS.tAz, k); if (Math.abs(Math.sin(camS.az - camS.tAz)) < 0.01) camS.tAz = null; }
    if (camS.auto) camS.az += dt*0.05;
  }
  const ce = Math.cos(camS.el);
  camera.position.set(camS.target.x + Math.sin(camS.az)*ce*camS.dist, camS.target.y + Math.sin(camS.el)*camS.dist, camS.target.z + Math.cos(camS.az)*ce*camS.dist);
  camera.lookAt(camS.target);
  scene.fog.density = 1.1 / (camS.dist*2.4 + 8);
}

let lastFrame = 0, frameCount = 0;
const _v = new THREE.Vector3();
// 站名避免重疊：路線上的站 > 大站 > 一般站，近的優先
let topH = 0;
function declutter(W, H){
  if (!topH){ const tb = document.getElementById('topbar'); topH = tb ? tb.offsetHeight - 6 : 60; }
  const arr = [];
  for (const sp of labels){
    _v.copy(sp.position).project(camera);
    arr.push({sp, x:(_v.x+1)/2*W, y:(1-_v.y)/2*H, z:_v.z, w:sp.userData.px*sp.userData.asp, h:sp.userData.px, d:camera.position.distanceToSquared(sp.position)});
  }
  const pr = sp => sp.userData.boost ? 3.5 : sp.userData.pri;
  arr.sort((a,b) => (pr(b.sp) - pr(a.sp)) || (a.d - b.d));
  const placed = [];
  for (const o of arr){
    let ok = !o.sp.userData.hide && o.z < 1 && o.x > -o.w/2 && o.x < W + o.w/2 && o.y > topH && o.y < H + o.h;
    if (ok) for (const p of placed){ if (Math.abs(o.x-p.x) < (o.w+p.w)/2 + 3 && Math.abs(o.y-p.y) < (o.h+p.h)/2 + 2){ ok = false; break; } }
    if (ok) ensureTex(o.sp);
    o.sp.visible = ok; if (ok) placed.push(o);
  }
  trimTex();
}
function loop(now){
  requestAnimationFrame(loop);
  const busy = ride.active || camS.tT || camS.tD || (performance.now() - camS.touchT < 1500);
  if (!busy && now - lastFrame < 32) return;   // 閒置時降到 30fps 省電
  lastFrame = now;
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  updateRide(dt);
  updateCamera(dt);
  for (const f of flows){
    const u = (f.u0 + t*0.45/f.seg.len) % 1;
    f.m.position.copy(f.seg.curve.getPointAt(u)); f.m.position.y += 0.005;
  }
  pins.forEach((p,i) => { p.position.y = 0.05 + Math.abs(Math.sin(t*2 + i))*0.08; p.rotation.y = t; });
  if (train.visible){ const s = 1 + (t*1.5 % 1)*1.6; train.ring.scale.set(s,s,s); train.ring.material.opacity = 0.7*(1 - (t*1.5 % 1)); }
  if (userDot.visible) userDot.children[0].position.y = 0.12 + Math.sin(t*3)*0.02;
  const cw = renderer.domElement.clientWidth || 300, ch = renderer.domElement.clientHeight || 300;
  const tanF = 2*Math.tan(camera.fov*Math.PI/360);
  for (const sp of labels){
    const d = camera.position.distanceTo(sp.position);
    const hw = sp.userData.px / ch * d * tanF;     // 讓字在螢幕上固定 px 大小
    sp.scale.set(hw*sp.userData.asp, hw, 1);
    sp.position.y = sp.userData.base + hw*0.6;
  }
  if (frameCount % 4 === 0) declutter(cw, ch);
  if (++frameCount % 30 === 0 && ride.active) renderRideHud(true);
  renderer.render(scene, camera);
}

// ====== 乘車引擎（時間推算 + GPS 校正） ======
const ride = {active:false, si:0, leg:0, legT:0, phase:'idle', dwell:0, speed:1, dispU:0, dispSi:-1, gpsWatch:null, gpsStatus:'未啟用', lastFix:null, off:null, alerted:{}, wake:null};
const ease = t => (1 - Math.cos(Math.PI*t))/2;
const easeInv = f => Math.acos(clamp(1 - 2*f, -1, 1))/Math.PI;
const curSeg = () => segs3D[ride.si];

function rideU(){
  const S = curSeg(), n = S.stU.length;
  if (ride.leg >= n-1) return 1;
  return S.stU[ride.leg] + (S.stU[ride.leg+1] - S.stU[ride.leg]) * (ride.phase === 'move' ? ease(ride.legT) : 0);
}

function startRide(r){
  if (r && r.steps) curRoute = r;
  if (!curRoute) return;
  if (ride.active) stopRide(true);
  buildRoute3D(curRoute);
  if (!segs3D.length){ toast('這段不需要搭車（同站或步行）'); return; }
  Object.assign(ride, {active:true, si:0, leg:0, legT:0, phase:'board', dwell:0, alerted:{}, dispSi:-1});
  train.stripeMat.color.set(segs3D[0].line.color); train.stripeMat.emissive.set(segs3D[0].line.color);
  train.visible = true; camS.follow = true; camS.azOff = 0; camS.auto = false; camS.dist = 1.6; camS.el = 0.42; camS.tT = null; camS.tD = null;
  placeTrain(1);
  pins.forEach(p => p.visible = false);
  requestWake();
  switchTab('ride'); renderRide();
}
function stopRide(silent){
  ride.active = false; ride.phase = 'idle'; train.visible = false; camS.follow = false;
  if (ride.wake){ try{ ride.wake.release(); }catch(e){} ride.wake = null; }
  if (silent === true) return;
  if (curRoute) buildRoute3D(curRoute);
  renderRide(); $('#miniHud').classList.remove('show');
}
async function requestWake(){ try{ if (navigator.wakeLock) ride.wake = await navigator.wakeLock.request('screen'); }catch(e){} }

function updateRide(dt){
  if (!ride.active) return;
  const S = curSeg(), st = S.step;
  if (ride.phase === 'move'){
    const m = Math.max(0.5, st.mins[ride.leg]);
    ride.legT += dt*ride.speed/(m*60);
    if (ride.legT >= 1) arriveAt(ride.leg + 1);
  } else if (ride.phase === 'dwell'){
    ride.dwell -= dt*ride.speed;
    if (ride.dwell <= 0){ ride.phase = 'move'; ride.legT = 0; renderRide(); }
  }
  placeTrain(dt);
}

function arriveAt(k){
  const S = curSeg(), n = S.step.stations.length;
  ride.leg = k; ride.legT = 0;
  if (k >= n-1){
    ride.leg = n-1;
    ride.phase = ride.si < segs3D.length-1 ? 'xfer' : 'done';
    buzz([200,100,200]);
    toast(ride.phase === 'done' ? '🎉 已抵達目的地 ' + ST[S.step.stations[n-1]][0] : '抵達 ' + ST[S.step.stations[n-1]][0] + '，請換乘');
  } else { ride.phase = 'dwell'; ride.dwell = 25; }
  renderRide();
}

function placeTrain(dt){
  const S = curSeg(); if (!S) return;
  const u = rideU();
  if (ride.dispSi !== ride.si){ ride.dispSi = ride.si; ride.dispU = u; }
  else ride.dispU += (u - ride.dispU) * Math.min(1, (dt||0)*4);
  const g = 0.31 / S.len;
  train.cars.forEach((car, i) => {
    const uu = clamp(ride.dispU - i*g, 0, 1);
    const p = S.curve.getPointAt(uu), t = S.curve.getTangentAt(uu);
    car.position.set(p.x, 0.135, p.z);
    car.lookAt(p.x + t.x, 0.135, p.z + t.z);
  });
  const lp = train.cars[0].position;
  train.light.position.set(lp.x, 0.4, lp.z); train.ring.position.set(lp.x, 0.1, lp.z);
}

function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

function remainingMin(){
  const S = curSeg(), st = S.step; let t = 0;
  if (ride.phase === 'board') t += S.line.wait*0.5;
  for (let i=ride.leg;i<st.mins.length;i++) t += st.mins[i] * (i === ride.leg && ride.phase === 'move' ? 1 - ride.legT : 1);
  let after = false;
  for (const s of curRoute.steps){
    if (s === st){ after = true; continue; }
    if (!after) continue;
    t += s.type === 'ride' ? s.total + LMAP[s.line].wait*0.5 : s.min;
  }
  return t;
}

function rideNext(){
  if (!ride.active) return;
  if (ride.phase === 'board'){ ride.phase = 'move'; ride.legT = 0; renderRide(); return; }
  if (ride.phase === 'xfer'){ boardNextSeg(); return; }
  if (ride.phase === 'move' || ride.phase === 'dwell') arriveAt(ride.leg + 1);
}
function ridePrev(){
  if (!ride.active) return;
  if ((ride.phase === 'xfer' || ride.phase === 'done')){ ride.leg = curSeg().step.stations.length-2; ride.phase = 'dwell'; ride.dwell = 15; renderRide(); return; }
  if (ride.leg > 0){ ride.leg--; ride.legT = 0; ride.phase = 'dwell'; ride.dwell = 15; }
  else { ride.phase = 'board'; ride.legT = 0; }
  renderRide();
}
function boardNextSeg(){
  ride.si++; ride.leg = 0; ride.legT = 0; ride.phase = 'move'; ride.dispSi = -1;
  const L = curSeg().line; train.stripeMat.color.set(L.color); train.stripeMat.emissive.set(L.color);
  renderRide();
}

// GPS
function toggleGPS(){
  if (ride.gpsWatch != null){ navigator.geolocation.clearWatch(ride.gpsWatch); ride.gpsWatch = null; ride.gpsStatus = '未啟用'; userDot.visible = false; renderRide(); return; }
  if (!('geolocation' in navigator)){ toast('此裝置/瀏覽器不支援定位'); return; }
  ride.gpsStatus = '要求定位權限中…'; renderRide();
  try{
    ride.gpsWatch = navigator.geolocation.watchPosition(onFix, onGpsErr, {enableHighAccuracy:true, maximumAge:3000, timeout:25000});
  }catch(e){ onGpsErr({code:1}); }
}
function onGpsErr(e){
  if (e.code === 1){
    if (ride.gpsWatch != null){ try{ navigator.geolocation.clearWatch(ride.gpsWatch); }catch(_){} }
    ride.gpsWatch = null; ride.gpsStatus = '定位被封鎖'; toast(GPS_BLOCK_MSG, 7000);
  } else ride.gpsStatus = e.code === 3 ? '等待訊號中（地下常收不到）' : '暫時無法定位';
  renderRide();
}
function onFix(pos){
  const {latitude:la, longitude:lo, accuracy:acc} = pos.coords;
  ride.lastFix = {la, lo, acc, t:Date.now()};
  ride.gpsStatus = `訊號 ±${Math.round(acc)}m`;
  userDot.position.copy(P(la, lo)); userDot.visible = true;
  const r = clamp(acc/1000, 0.03, 2); userDot.ring.scale.set(r, r, r);
  if (ride.active && acc < 300) snapToRoute(la, lo);
  renderRide();
}
function snapToRoute(la, lo){
  const p = P(la, lo, 0.09);
  let best = null;
  for (let j=ride.si; j<Math.min(segs3D.length, ride.si+2); j++){
    const S = segs3D[j];
    for (let i=0;i<=S.N;i++){
      const q = S.samples[i], d = Math.hypot(q.x-p.x, q.z-p.z);
      if (!best || d < best.d - (j > ride.si ? 0.05 : 0)) best = {d, j, u:i/S.N};
    }
  }
  if (!best || best.d > 0.8){ ride.off = best ? best.d : null; return; }
  ride.off = null;
  const S = segs3D[best.j];
  // 是否靠近某站
  let nearK = -1;
  S.stPos.forEach((sp,k) => { if (Math.hypot(sp.x-p.x, sp.z-p.z) < 0.2) nearK = k; });
  if (best.j > ride.si){
    if (nearK === 0) return;                 // 還在換乘站
    ride.si = best.j; ride.dispSi = -1;
    const L = S.line; train.stripeMat.color.set(L.color); train.stripeMat.emissive.set(L.color);
  } else {
    const cu = rideU();
    if (best.u < cu - 0.01 && cu - best.u < 0.2 && ride.phase !== 'board') return;   // 小幅倒退忽略
    if ((ride.phase === 'board') && nearK === 0) return;
  }
  const n = S.stU.length;
  if (nearK >= 0){
    if (nearK === ride.leg && ride.phase === 'dwell') return;
    if (nearK >= n-1){ if (ride.phase !== 'xfer' && ride.phase !== 'done') arriveAt(n-1); return; }
    ride.leg = nearK; ride.legT = 0; ride.phase = 'dwell'; ride.dwell = 20; renderRide(); return;
  }
  let leg = 0; while (leg < n-2 && best.u >= S.stU[leg+1]) leg++;
  const f = (best.u - S.stU[leg]) / Math.max(1e-6, S.stU[leg+1] - S.stU[leg]);
  ride.leg = leg; ride.legT = easeInv(clamp(f, 0, 0.98)); ride.phase = 'move';
  renderRide();
}

function renderPicker(q){
  if (pickMode === 'spot') return renderSpotPicker(q);

  let groups = {}; AREA_ORDER.forEach(g => groups[g] = []);
  for (const id in ST){
    if (q && !stIndex[id].includes(q)) continue;

  for (const g in groups) groups[g].sort((x,y) => (rank(x) - rank(y)) || ((SERVE[y]||[]).length - (SERVE[x]||[]).length));
  if (q){ const all = Object.values(groups).flat().sort((x,y) => rank(x) - rank(y)); const best = all.filter(x => rank(x) <= 1);
    if (best.length){ const bs = new Set(best); for (const g in groups) groups[g] = groups[g].filter(x => !bs.has(x)); groups = Object.assign({'最符合': best}, groups); } }

// ====== 多天行程 ======
const SPOT_BY = {}; SPOTS.forEach((s,i) => SPOT_BY[s.n] = i);
const WD = '日一二三四五六';
let trips = [], otherTrips = [], curTripId = null, curDay = 0, openLeg = -1;
const tripCity = o => (o && o.city) || 'osaka';
const routeCache = new Map();
function routeOf(a, b){ if (!a || !b || a === b) return null; const k = a+'|'+b; if (!routeCache.has(k)) routeCache.set(k, planRoute(a, b, false)); return routeCache.get(k); }
const legMin = (a, b) => { if (!a || !b || a === b) return 0; const r = routeOf(a, b); return r ? r.total : 999; };
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const isoDate = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function defaultStart(){ const d = new Date(); d.setDate(d.getDate()+14); return isoDate(d); }
const mkDay = () => ({t:'09:00', from:null, end:'home', stops:[]});
function newTrip(name){ return {id:uid(), city:CITY_ID, name:name||`我的${CITY.name}行程`, start:defaultStart(), home:homeId||null, days:[mkDay(),mkDay(),mkDay(),mkDay()], wish:[], updated:Date.now()}; }
function curTrip(){
  let t = trips.find(x => x.id === curTripId);
  if (!t){ t = trips[0]; if (!t){ t = newTrip(); trips.push(t); } curTripId = t.id; }
  return t;
}
function dayDateLabel(t, k){
  if (!t.start) return '';
  const d = new Date(t.start + 'T00:00:00'); if (isNaN(d)) return '';
  d.setDate(d.getDate()+k); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;
}
const stopSt = s => s.s != null ? (SPOT_BY[s.s] != null ? SPOTS[SPOT_BY[s.s]].st : null) : s.st;
const stopName = s => s.s != null ? s.s : (ST[s.st] ? ST[s.st][0] + '站' : '?');
const stopHours = s => s.h != null ? s.h : (s.s != null && SPOT_BY[s.s] != null ? SPOTS[SPOT_BY[s.s]].h : 1);
const dayStart = (t, d) => d.from || t.home;
const dayEnd = (t, d) => d.end === 'none' ? null : (d.end === 'home' || !d.end) ? t.home : d.end;
const toMin = s => { const [h,m] = (s||'09:00').split(':').map(Number); return (h||0)*60 + (m||0); };
const fmtMin = m => { m = Math.round(m); return String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(((m%60)+60)%60).padStart(2,'0'); };
function spotDayOf(n){ return curTrip().days.findIndex(d => d.stops.some(s => s.s === n)); }

function sanitizeTrip(o){
  if (!o || typeof o !== 'object') return null;
  const t = {
    id: typeof o.id === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(o.id) ? o.id : uid(), city: CITY_ID,
    name: String(o.name || '行程').slice(0,60),
    start: /^\d{4}-\d{2}-\d{2}$/.test(o.start || '') ? o.start : '',
    home: ST[o.home] ? o.home : null, wish:[], days:[], updated: +o.updated || Date.now()
  };
  t.wish = (Array.isArray(o.wish) ? o.wish : []).filter(n => SPOT_BY[n] != null);
  for (const d of (Array.isArray(o.days) ? o.days : []).slice(0,30)){
    if (!d || typeof d !== 'object') continue;
    const nd = {t: /^\d{2}:\d{2}$/.test(d.t || '') ? d.t : '09:00', from: ST[d.from] ? d.from : null,
      end: (d.end === 'home' || d.end === 'none' || ST[d.end]) ? d.end : 'home', stops:[]};
    for (const s of (Array.isArray(d.stops) ? d.stops : []).slice(0,40)){
      if (!s) continue;
      const h = s.h != null ? clamp(+s.h || 1, 0.25, 14) : null;
      if (s.s != null && SPOT_BY[s.s] != null) nd.stops.push(h != null ? {s:s.s, h} : {s:s.s});
      else if (ST[s.st]) nd.stops.push(h != null ? {st:s.st, h} : {st:s.st});
    }
    t.days.push(nd);
  }
  if (!t.days.length) t.days.push(mkDay());
  return t;
}

function saveLocal(){ store.set('trips', [...otherTrips, ...trips]); store.set('curTrip', curTripId); }
function touch(t, opts={}){

function toggleWish(n){
  const t = curTrip(), i = t.wish.indexOf(n);
  if (i >= 0) t.wish.splice(i,1); else { t.wish.push(n); toast('⭐ 已加入想去：' + n); }
  touch(t);
}
function addSpotToDay(n, k){
  const t = curTrip(); k = clamp(k|0, 0, t.days.length-1);
  t.days.forEach(d => d.stops = d.stops.filter(s => s.s !== n));
  t.days[k].stops.push({s:n}); t.wish = t.wish.filter(x => x !== n);
  curDay = k; openLeg = -1; toast(`已排入第 ${k+1} 天：${n}`); touch(t);
}
function addStationToDay(id, k){
  const t = curTrip(); k = clamp(k|0, 0, t.days.length-1);
  t.days[k].stops.push({st:id}); curDay = k; openLeg = -1; toast(`已排入第 ${k+1} 天：${ST[id][0]}站`); touch(t);
}
function syncHome(id){ const t = curTrip(); if (t.home !== id){ t.home = id; touch(t); } }

// 一天的時間表
function dayPlan(t, k){
  const d = t.days[k]; const legs = [], items = [];
  let prev = dayStart(t, d), tm = toMin(d.t);
  const start = {st:prev, time:tm};
  d.stops.forEach(s => {
    const st = stopSt(s), r = routeOf(prev, st);
    const m = prev && st && prev !== st ? (r ? r.total : 0) : 0;
    legs.push({from:prev, to:st, r, min:m});
    tm += m; const arr = tm; tm += Math.round(stopHours(s)*60);
    items.push({s, st, arr, dep:tm}); prev = st;
  });
  const end = dayEnd(t, d); let back = null;
  if (end && (d.stops.length || d.from)){
    const r = routeOf(prev, end), m = prev && prev !== end ? (r ? r.total : 0) : 0;
    back = {from:prev, to:end, r, min:m}; tm += m;
  }
  const travel = legs.reduce((a,l) => a + l.min, 0) + (back ? back.min : 0);
  const stay = d.stops.reduce((a,s) => a + stopHours(s), 0);
  return {d, start, legs, items, back, endTime:tm, travel, stay};
}

// 最佳順序（≤8 個景點窮舉，其餘最近鄰 + 2-opt）
function optimizeDay(t, k, silent){
  const d = t.days[k], n = d.stops.length;
  if (n < 2){ if (!silent) toast('至少要有 2 個地點才需要排序'); return; }
  const s0 = dayStart(t, d), e0 = dayEnd(t, d);
  const sts = d.stops.map(stopSt);
  const S = sts.map(x => s0 ? legMin(s0, x) : 0), E = sts.map(x => e0 ? legMin(x, e0) : 0);
  const C = sts.map(a => sts.map(b => legMin(a, b)));
  const cost = o => { let c = S[o[0]]; for (let i=1;i<o.length;i++) c += C[o[i-1]][o[i]]; return c + E[o[o.length-1]]; };
  let best = [...Array(n).keys()], bc = cost(best);
  const before = bc;
  if (n <= 8){
    const a = best.slice(), c = new Array(n).fill(0); let i = 0;
    while (i < n){
      if (c[i] < i){
        if (i % 2 === 0) [a[0], a[i]] = [a[i], a[0]]; else [a[c[i]], a[i]] = [a[i], a[c[i]]];
        const v = cost(a); if (v < bc){ bc = v; best = a.slice(); }
        c[i]++; i = 0;
      } else { c[i] = 0; i++; }
    }
  } else {
    const used = new Set(), o = []; let cur = null;
    for (let step=0; step<n; step++){
      let bi = -1, bv = 1e9;
      for (let j=0;j<n;j++) if (!used.has(j)){ const v = cur == null ? S[j] : C[cur][j]; if (v < bv){ bv = v; bi = j; } }
      used.add(bi); o.push(bi); cur = bi;
    }
    best = o; bc = cost(o);
    let improved = true;
    while (improved){
      improved = false;
      for (let i=0;i<n-1;i++) for (let j=i+1;j<n;j++){
        const cand = best.slice(0,i).concat(best.slice(i,j+1).reverse(), best.slice(j+1));
        const v = cost(cand); if (v < bc - 0.01){ bc = v; best = cand; improved = true; }
      }
    }
  }
  d.stops = best.map(i => d.stops[i]);
  if (silent) return;
  toast(bc < before ? `已重新排序：交通時間 ${before} 分 → ${bc} 分` : '目前順序已經是最省交通時間的了');
  openLeg = -1; touch(t);
}

// 自動分配到各天
function autoArrange(t){
  if (!t.home){ toast('請先設定住宿車站'); pickHome(() => autoArrange(curTrip())); return; }
  const pool = [...new Set([...t.days.flatMap(d => d.stops.filter(s => s.s != null).map(s => s.s)), ...t.wish])];
  if (!pool.length){ toast('先在「景點」頁或 3D 地圖把想去的地方加 ⭐'); return; }
  t.days.forEach(d => d.stops = d.stops.filter(s => s.s == null));
  const sp = pool.map(n => SPOTS[SPOT_BY[n]]);
  const CAP = 10*60, groups = [];
  sp.filter(s => s.h >= 6).forEach(s => groups.push([s]));
  const rest = sp.filter(s => s.h < 6);
  for (const a of CITY.spotAreas){
    const left = rest.filter(s => s.a === a);
    while (left.length){
      left.sort((x,y) => legMin(t.home, y.st) - legMin(t.home, x.st));
      const g = [left.shift()];
      let load = legMin(t.home, g[0].st)*2 + g[0].h*60;
      while (left.length){
        let bi = -1, bv = 1e9;
        left.forEach((s,i) => { const v = Math.min(...g.map(x => legMin(x.st, s.st))); if (v < bv){ bv = v; bi = i; } });
        const s = left[bi], add = bv + s.h*60 + 10;
        if (load + add > CAP) break;
        g.push(s); load += add; left.splice(bi,1);
      }
      groups.push(g);
    }
  }
  // 天數不夠時，合併最輕的兩組（同區、合計不超過上限太多）
  const load = g => g.reduce((a,x) => a + x.h*60, 0) + 2*legMin(t.home, g[0].st) + (g.length-1)*20;
  while (groups.length > t.days.length){
    let best = null;
    for (let i=0;i<groups.length;i++) for (let j=i+1;j<groups.length;j++){
      const a = groups[i], b = groups[j];
      if (a[0].h >= 6 || b[0].h >= 6 || a[0].a !== b[0].a) continue;
      const L2 = load(a.concat(b));
      if (L2 <= CAP*1.12 && (!best || L2 < best.L)) best = {i, j, L:L2};
    }
    if (!best) break;
    groups[best.i] = groups[best.i].concat(groups[best.j]); groups.splice(best.j, 1);
  }
  // 把主要城市市區的天排前面、樂園／外縣市往後，避免抵達日太累
  const A0 = CITY.spotAreas[0];
  groups.sort((x,y) => (x[0].a === A0 && x[0].h < 6 ? 0 : 1) - (y[0].a === A0 && y[0].h < 6 ? 0 : 1));
  const leftover = [];
  groups.forEach((g,i) => { if (i < t.days.length) t.days[i].stops.push(...g.map(s => ({s:s.n}))); else leftover.push(...g.map(s => s.n)); });
  t.wish = leftover;
  t.days.forEach((d,k) => { if (d.stops.length > 1) optimizeDay(t, k, true); });
  curDay = 0; openLeg = -1; touch(t); viewDay();
  const used = Math.min(groups.length, t.days.length);
  toast(leftover.length ? `排好 ${used} 天；還有 ${leftover.length} 個景點排不下，留在想去清單（可增加天數）` : `已自動排好 ${used} 天的行程，各天也排好了最佳順序`, 5000);
}

// ---- 3D ----
function dayMarks(t, P){
  return P.items.map((it,i) => {
    if (it.s.s != null){ const sp = SPOTS[SPOT_BY[it.s.s]]; return {y:sp.y, x:sp.x, label:`${i+1} ${sp.n}`}; }
    return {y:ST[it.st][2], x:ST[it.st][3], label:`${i+1} ${ST[it.st][0]}`};
  });
}
function viewDay(){
  if (ride.active) return;
  const t = curTrip(), P = dayPlan(t, curDay);
  const legs = [...P.legs.map(l => l.r), P.back && P.back.r].filter(Boolean);
  curRoute = null;
  if (!legs.length && !P.items.length){ buildRoute3D(null); return; }
  buildRoute3D(null, {legs, marks:dayMarks(t, P), home:dayStart(t, P.d)});
}
function getLeg(k){ const P = dayPlan(curTrip(), curDay); return k === 'b' ? P.back : P.legs[+k]; }
function legSpot(k){
  if (k === 'b') return null;
  const it = curTrip().days[curDay].stops[+k];
  return it && it.s != null ? SPOTS[SPOT_BY[it.s]] : null;
}
function showLeg(k){
  const l = getLeg(k); if (!l || !l.r) return;
  curRoute = Object.assign({}, l.r, {spot:legSpot(k)});
  buildRoute3D(curRoute);
}
function rideLeg(k){
  k = String(k); const l = getLeg(k); if (!l || !l.r){ toast('這段不需要搭車'); return; }
  startRide(Object.assign({}, l.r, {spot:legSpot(k)}));
}
function dayRideList(){
  const t = curTrip(), P = dayPlan(t, curDay);
  const ls = [...P.legs.map((l,i) => [l, String(i)]), ...(P.back ? [[P.back,'b']] : [])].filter(([l]) => l.r);
  if (!ls.length) return `<div class="card"><p class="mut" style="margin:0">在「行程」頁排好第 ${curDay+1} 天後，這裡可以直接選一段開始導航。</p></div>`;
  return `<div class="card"><b>🗓️ 第 ${curDay+1} 天 ${dayDateLabel(t,curDay)} 的交通</b>${ls.map(([l,k]) =>
    `<button class="leg" data-rideleg="${k}"><span class="lt">${esc(ST[l.from][0])} → ${esc(ST[l.to][0])}</span><span>約 ${l.r.total} 分</span><span class="chev">🚃</span></button>`).join('')}</div>`;
}

// ---- 行程頁 UI ----
function stepsCompact(r){
  return r.steps.map(s => {
    if (s.type === 'walk') return `<div class="sc">🚶 步行到 ${esc(ST[s.b][0])}（約${s.min}分）</div>`;
    if (s.type === 'xfer') return `<div class="sc">🔁 在 ${esc(ST[s.at][0])} 站內換乘</div>`;
    const L = LMAP[s.line], n = s.stations.length - 1;
    return `<div class="sc">${badge(L)} <b>${esc(L.name)}</b> 往 ${esc(s.dirLabel)}<br><span class="mut">${esc(ST[s.stations[0]][0])} → ${esc(ST[s.stations[n]][0])} · ${n} 站 · 約 ${s.total} 分</span></div>`;
  }).join('');
}
function legRow(l, k){
  if (!l.from || !l.to) return `<div class="leg none">— 請先設定住宿車站 —</div>`;
  if (l.from === l.to || !l.r) return `<div class="leg same">🚶 同一站附近，步行即可</div>`;
  const r = l.r, open = openLeg === String(k);
  const bs = r.steps.filter(s => s.type === 'ride').map(s => badge(LMAP[s.line])).join('<span class="sa">›</span>');
  let h = `<button class="leg" data-leg="${k}"><span class="lt">${bs}</span><span>約 ${r.total} 分${r.transfers ? ` · 轉 ${r.transfers}` : ''}</span><span class="chev">${open ? '▾' : '▸'}</span></button>`;
  if (open) h += `<div class="legd">${stepsCompact(r)}
    <div class="row"><button class="sec" data-leg3d="${k}">🗺️ 3D 顯示</button><button class="primary" data-legride="${k}">🚃 開始導航</button></div>
    <a class="ext" href="${gmapsTransit(r.from, r.to)}" target="_blank" rel="noopener">Google 地圖即時班次 ↗</a></div>`;
  return h;
}
function stationRow(kind, st, time, label){
  return `<div class="stop se"><span class="num ${kind}">${kind === 'start' ? '起' : '終'}</span><div class="sb"><b>${st ? esc(ST[st][0]) + '站' : '未設定'}</b><div class="mut">${time} · ${label}</div></div></div>`;
}
function stopRow(it, i, t){
  const s = it.s, sp = s.s != null ? SPOTS[SPOT_BY[s.s]] : null, hv = stopHours(s);
  const hs = [0.5,1,1.5,2,2.5,3,4,5,6,8,10]; if (!hs.includes(hv)) hs.push(hv);
  return `<div class="stop"><span class="num">${i+1}</span><div class="sb">
    <b>${esc(stopName(s))}</b>
    <div class="mut">${fmtMin(it.arr)}–${fmtMin(it.dep)} · ${esc(ST[it.st][0])}站${sp && sp.ex ? ' ' + esc(sp.ex) : ''}${sp ? ` · 步行${sp.w}分` : ''}</div>
    <div class="sctl"><button data-up="${i}" aria-label="上移">↑</button><button data-dn="${i}" aria-label="下移">↓</button>
      <select data-hrs="${i}">${hs.sort((a,b)=>a-b).map(v => `<option value="${v}" ${v === hv ? 'selected' : ''}>停 ${v}h</option>`).join('')}</select>
      <select data-mv="${i}">${t.days.map((d,k) => `<option value="${k}" ${k === curDay ? 'selected' : ''}>第${k+1}天</option>`).join('')}</select>
      ${sp ? `<button data-info="${SPOT_BY[s.s]}" aria-label="資訊">ⓘ</button>` : ''}<button data-del="${i}" aria-label="移除">✕</button></div>
  </div></div>`;
}

    <div class="trip-top"><select id="tripSel" class="sel">${trips.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.name)}${cloud.ids.has(x.id) ? ' ☁️' : ''}</option>`).join('')}</select>

  </div>`;

    <div class="note">依區域與距離分天（京都、奈良、神戶各自一天，USJ 單獨一天），每天再排出最省交通時間的順序。會重新安排所有景點，你手動加的車站會保留。</div></div>`;
  h += `<div class="daytabs">${t.days.map((x,k) => `<button class="chip ${k === curDay ? 'on' : ''}" data-day="${k}">第${k+1}天<small>${dayDateLabel(t,k)}</small>${x.stops.length ? `<i>${x.stops.length}</i>` : ''}</button>`).join('')}</div>`;
  h += `<div class="card day"><div class="hrow"><b>第 ${curDay+1} 天 ${dayDateLabel(t, curDay)}</b><label class="tm">出發 <input type="time" id="dayT" value="${d.t}"></label></div><div class="tl2">`;
  h += stationRow('start', P.start.st, fmtMin(P.start.time), d.from ? '起點（自訂）' : '🏨 從住宿出發');

  if (P.back){ h += legRow(P.back, 'b'); h += stationRow('end', P.back.to, fmtMin(P.endTime), d.end === 'home' || !d.end ? '🏨 回到住宿' : '結束'); }
  h += `</div>`;

    <div class="row"><button class="sec" id="dayFrom">起點：${esc(d.from ? ST[d.from][0] : '住宿')}</button>
      <select class="sel" id="dayEnd"><option value="home">結束：回住宿</option><option value="none">結束：不回住宿</option>${endOpt}<option value="pick">結束：指定車站…</option></select></div></div>`;
  h += `<div class="card"><b>💾 儲存與分享</b>
    <div class="row"><button class="sec" id="shText">📋 文字行程</button><button class="sec" id="shCode">🔗 ${IN_FRAME ? '分享碼' : '分享連結'}</button></div>
